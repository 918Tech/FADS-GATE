name: 918 World-Use Readiness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FADS-GATE
        run: python -m pip install .
      - name: Unit and security regression tests
        run: python -m unittest discover -s tests -v
      - name: Deterministic defense benchmark
        run: fads-benchmark
      - name: Enforce TEST_READY release gate
        run: fads-release-gate --mode test
